name: Build horror reels

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore processed-story state
        uses: actions/cache@v4
        with:
          path: .automation-state
          key: processed-stories-${{ github.run_id }}
          restore-keys: |
            processed-stories-

      - name: Install FFmpeg and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test caption layout and renderer
        run: python -m unittest discover -s scripts -p test_rendering.py -v

      - name: Generate Chapter 8 and four standalone stories
        if: ${{ vars.ENABLE_AI_GENERATION != 'false' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_STORY_MODEL: ${{ vars.OPENAI_STORY_MODEL || 'gpt-5-mini' }}
        run: |
          python scripts/generate_daily.py \
            --state .automation-state/generation.json \
            --pending .automation-state/pending-generation.json \
            --output content/generated

      - name: Render today's stories
        id: render
        env:
          NARRATION_BACKEND: ${{ vars.NARRATION_BACKEND || 'edge' }}
          NARRATION_VOICE: ${{ vars.NARRATION_VOICE || 'en-GB-RyanNeural' }}
          NARRATION_RATE: ${{ vars.NARRATION_RATE || '-10%' }}
          NARRATION_VOLUME: ${{ vars.NARRATION_VOLUME || '-18%' }}
          NARRATION_PITCH: ${{ vars.NARRATION_PITCH || '-10Hz' }}
          OPENAI_TTS_VOICE: ${{ vars.OPENAI_TTS_VOICE || 'onyx' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ vars.ENABLE_AI_GENERATION }}" = "false" ]; then
            python scripts/render.py --queue content/queue --state .automation-state/processed.json --limit 1
          else
            python scripts/select_daily.py --generated content/generated --backlog content/backlog --processed .automation-state/processed.json --pending .automation-state/pending-generation.json
            python scripts/render.py --queue content/generated --state .automation-state/processed.json
          fi
          if find output -maxdepth 1 -name '*.mp4' -print -quit 2>/dev/null | grep -q .; then
            echo "has_output=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_output=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify outputs
        if: ${{ steps.render.outputs.has_output == 'true' }}
        run: |
          for video in output/*.mp4; do
            ffprobe -v error -show_entries format=duration,size -of json "$video"
          done

      - name: Send videos to TikTok
        if: ${{ steps.render.outputs.has_output == 'true' && vars.ENABLE_TIKTOK == 'true' }}
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'SELF_ONLY' }}
        run: |
          python scripts/upload_tiktok.py output \
            --state .automation-state/processed.json \
            --generation-state .automation-state/generation.json \
            --pending-generation .automation-state/pending-generation.json

      - name: Save rendered videos
        if: ${{ always() && steps.render.outputs.has_output == 'true' }}
        id: videos
        uses: actions/upload-artifact@v4
        with:
          name: rendered-horror-reels
          path: output/
          retention-days: 14
          if-no-files-found: error

      - name: Show video download link
        if: ${{ always() && steps.videos.outcome == 'success' }}
        env:
          ARTIFACT_URL: ${{ steps.videos.outputs.artifact-url }}
        run: |
          echo "### Download your videos" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download rendered-horror-reels ZIP]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Unzip the download on your computer. Videos are saved even when TikTok is disabled." >> "$GITHUB_STEP_SUMMARY"
